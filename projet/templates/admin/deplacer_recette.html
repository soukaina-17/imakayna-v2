{% extends "dashboard.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">🔄 Déplacer la recette : <strong>{{ recette.title }}</strong></h2>

    <!-- Formulaire de déplacement -->
    <form method="POST">
        {{ form.csrf_token }}

        <!-- Sélection de la nouvelle catégorie -->
        <div class="mb-3">
            {{ form.nouveau_plat.label(class="form-label") }}
            {{ form.nouveau_plat(class="form-select") }}
        </div>

        <!-- Boutons d'action -->
        <div class="d-flex justify-content-start">
            {{ form.submit(class="btn btn-primary") }}
            <a href="{{ url_for('recettes.recettes_a_valider') }}" class="btn btn-secondary ms-2">↩ Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
